---
pa_networks:
  mgmt:
    ifname: mgmt
    bond: bond0
    managed: false          

  corosync:
    ifname: csync
    bond: bond1
    mode: static
    prefix: "172.16.254"
    prefix_len: 24

  ceph_public:
    ifname: cephpub
    bond: bond2
    mode: static
    prefix: "172.16.253"
    prefix_len: 24

  ceph_cluster:
    ifname: cephcl
    bond: bond3
    mode: static
    prefix: "172.16.252"
    prefix_len: 24

  sdn_trunk:
    ifname: trunk
    bond: bond4
    mode: bridge
    bridge_name: vmbr1
    bridge_prefix: "172.16.251"
    bridge_prefix_len: 24

pa_corosync_prefix: "{{ pa_networks.corosync.prefix }}"
pa_corosync_network: "{{ pa_networks.corosync.prefix }}.0/{{ pa_networks.corosync.prefix_len }}"
pa_ceph_public_prefix: "{{ pa_networks.ceph_public.prefix }}"
pa_ceph_public_network: "{{ pa_networks.ceph_public.prefix }}.0/{{ pa_networks.ceph_public.prefix_len }}"
pa_ceph_cluster_prefix: "{{ pa_networks.ceph_cluster.prefix }}"
pa_ceph_cluster_network: "{{ pa_networks.ceph_cluster.prefix }}.0/{{ pa_networks.ceph_cluster.prefix_len }}"

pa_ceph_osd_disks:
  - /dev/sdc
  - /dev/sdd

pa_sdn_peers:
  - "172.16.251.11"
  - "172.16.251.12"
  - "172.16.251.13"