---
- name: Rafraîchir le catalogue des templates LXC
  ansible.builtin.command:
    cmd: pveam update
  changed_when: false

- name: Lister les templates disponibles au catalogue
  ansible.builtin.command:
    cmd: pveam available --section system
  register: pa_lxc_available
  changed_when: false

- name: Vérifier que les templates demandés existent au catalogue
  ansible.builtin.assert:
    that: item in pa_lxc_available.stdout
    fail_msg: |-
      Template '{{ item }}' absent du catalogue.
      Entrées correspondantes :
      {{ pa_lxc_available.stdout_lines
         | select('search', item.split('-')[0]) | list | join('\n') }}
    quiet: true
  loop: "{{ pa_lxc_templates }}"

- name: Lister les templates présents sur le nœud
  ansible.builtin.command:
    cmd: pveam list local
  register: pa_lxc_present
  changed_when: false
  failed_when: false

- name: Télécharger les templates manquants
  ansible.builtin.command:
    cmd: "pveam download local {{ item }}"
  loop: "{{ pa_lxc_templates }}"
  when: item not in (pa_lxc_present.stdout | default(''))
  changed_when: true