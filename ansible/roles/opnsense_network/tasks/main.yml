---
- name: Vérifier que l'API répond
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}/api/core/firmware/status"
    method: GET
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
  changed_when: false

- name: Lister les interfaces déjà assignées
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_assign_search }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body: {}
  register: pa_assign_before
  changed_when: false

- name: Assigner les cartes non encore assignées
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_assign_add }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body:
      interface:
        if: "{{ item.device }}"
        descr: "{{ item.name }}"
  register: pa_assign_add
  failed_when:
    - pa_assign_add.json.result is defined
    - pa_assign_add.json.result not in ['saved', 'ok']
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }} ({{ item.device }})"
  when: item.device not in (pa_assign_before.json.rows | default([]) | map(attribute='if') | list)

- name: Appliquer les assignations
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_assign_reconfigure }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body: {}
  changed_when: false

- name: Lire l'état des interfaces
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_overview }}"
    method: GET
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
  register: pa_overview
  changed_when: false

- name: Construire la table description -> configuration
  ansible.builtin.set_fact:
    pa_if_config: >-
      {{ dict(_rows | map(attribute='description') | list
              | zip(_rows | map(attribute='config') | list)) }}
  vars:
    _rows: >-
      {{ pa_overview.json.rows
         | selectattr('config', 'defined')
         | selectattr('description', 'defined') | list }}

- name: Récapituler l'adressage restant à poser
  ansible.builtin.debug:
    msg: >-
      {{ item.name }} ({{ item.device }}) : {{ 'conforme' if _cur == _want else
      'Interfaces > ' ~ item.name ~ ' : cocher Enable, IPv4 Static, adresse '
      ~ _want ~ ', MTU ' ~ pa_opnsense_segment_mtu }}
  vars:
    _cur: "{{ (pa_if_config[item.name].ipaddr | default('')) ~ '/' ~ (pa_if_config[item.name].subnet | default('')) }}"
    _want: "{{ item.cidr | regex_replace('^(\\d+\\.\\d+\\.\\d+)\\.\\d+/(\\d+)$', '\\1.1/\\2') }}"
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }}"

- name: Exiger que l'adressage soit conforme
  ansible.builtin.assert:
    that: _cur == _want
    fail_msg: "{{ item.name }} : adresse {{ _cur }} au lieu de {{ _want }}."
    quiet: true
  vars:
    _cur: "{{ (pa_if_config[item.name].ipaddr | default('')) ~ '/' ~ (pa_if_config[item.name].subnet | default('')) }}"
    _want: "{{ item.cidr | regex_replace('^(\\d+\\.\\d+\\.\\d+)\\.\\d+/(\\d+)$', '\\1.1/\\2') }}"
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }}"
  when: pa_opnsense_require_addressing | bool