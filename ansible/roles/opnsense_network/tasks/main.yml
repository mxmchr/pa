---
- name: Vérifier que l'API répond
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}/api/core/firmware/status"
    method: GET
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
  changed_when: false

- name: Lister les périphériques VLAN existants
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_vlan_search }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body: {}
  register: pa_vlan_before
  changed_when: false

- name: Créer les périphériques VLAN manquants
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_vlan_add }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body:
      vlan:
        if: "{{ pa_opnsense_trunk_device }}"
        tag: "{{ item.tag | string }}"
        pcp: "0"
        descr: "{{ item.name }}"
  register: pa_vlan_add
  failed_when:
    - pa_vlan_add.json.result is defined
    - pa_vlan_add.json.result not in ['saved', 'ok']
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }} (tag {{ item.tag }})"
  when: item.tag | string not in (pa_vlan_before.json.rows | default([]) | map(attribute='tag') | map('string') | list)

- name: Appliquer les périphériques VLAN
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_vlan_reconfigure }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body: {}
  changed_when: false

- name: Relire les périphériques VLAN
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_vlan_search }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body: {}
  register: pa_vlan_all
  changed_when: false

- name: Vérifier que chaque segment a son périphérique VLAN
  ansible.builtin.assert:
    that: pa_vlan_all.json.rows | selectattr('tag', 'equalto', item.tag | string) | list | length == 1
    fail_msg: "Aucun périphérique VLAN pour {{ item.name }} (tag {{ item.tag }})."
    quiet: true
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }}"

- name: Lister les interfaces déjà assignées
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_assign_search }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body: {}
  register: pa_assign_before
  changed_when: false

- name: Assigner les périphériques VLAN non encore assignés
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_assign_add }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body:
      interface:
        if: "{{ _device }}"
        descr: "{{ pa_opnsense_if_prefix }}{{ item.name }}"
  vars:
    _device: "{{ (pa_vlan_all.json.rows | selectattr('tag', 'equalto', item.tag | string) | first).vlanif.split(' ')[0] }}"
  register: pa_assign_add
  failed_when:
    - pa_assign_add.json.result is defined
    - pa_assign_add.json.result not in ['saved', 'ok']
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }} ({{ _device }})"
  when: _device not in (pa_assign_before.json.rows | default([]) | map(attribute='if') | list)

- name: Appliquer les assignations
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_assign_reconfigure }}"
    method: POST
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
    body_format: json
    body: {}
  changed_when: false


- name: Lire l'état des interfaces
  ansible.builtin.uri:
    url: "{{ pa_opnsense_url }}{{ pa_opnsense_ep_overview }}"
    method: GET
    url_username: "{{ pa_opnsense_api_key }}"
    url_password: "{{ pa_opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: "{{ pa_opnsense_validate_certs }}"
  register: pa_overview
  changed_when: false

- name: Construire la table description -> configuration
  ansible.builtin.set_fact:
    pa_if_config: >-
      {{ dict(pa_overview.json.rows | map(attribute='description') | list
              | zip(pa_overview.json.rows | map(attribute='config') | list)) }}

- name: Récapituler l'adressage restant à poser
  ansible.builtin.debug:
    msg: >-
      {{ _name }} ({{ item.cidr }}) : {{ 'conforme' if _cur == _want else
      'Interfaces > ' ~ _name ~ ' : cocher Enable, IPv4 Static, adresse ' ~ _want }}
  vars:
    _name: "{{ pa_opnsense_if_prefix }}{{ item.name }}"
    _cur: "{{ (pa_if_config[_name].ipaddr | default('')) ~ '/' ~ (pa_if_config[_name].subnet | default('')) }}"
    _want: "{{ item.cidr | regex_replace('^(\\d+\\.\\d+\\.\\d+)\\.\\d+/(\\d+)$', '\\1.1/\\2') }}"
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }}"

- name: Exiger que l'adressage soit conforme
  ansible.builtin.assert:
    that: _cur == _want
    fail_msg: "{{ _name }} : adresse {{ _cur }} au lieu de {{ _want }}."
    quiet: true
  vars:
    _name: "{{ pa_opnsense_if_prefix }}{{ item.name }}"
    _cur: "{{ (pa_if_config[_name].ipaddr | default('')) ~ '/' ~ (pa_if_config[_name].subnet | default('')) }}"
    _want: "{{ item.cidr | regex_replace('^(\\d+\\.\\d+\\.\\d+)\\.\\d+/(\\d+)$', '\\1.1/\\2') }}"
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }}"
  when: pa_opnsense_require_addressing | bool