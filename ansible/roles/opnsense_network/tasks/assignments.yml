---

- name: Construire la table périphérique -> identifiant optN
  ansible.builtin.set_fact:
    pa_device_to_ident: >-
      {{ dict(pa_assign_after.json.rows | map(attribute='if') | list
              | zip(pa_assign_after.json.rows | map(attribute='identifier') | list)) }}

- name: Construire l'adressage voulu
  ansible.builtin.set_fact:
    pa_wanted_addressing: >-
      {{ pa_wanted_addressing | default({}) | combine({
           pa_device_to_ident[_device]: {
             'ipaddr': item.cidr | regex_replace('^(\d+\.\d+\.\d+)\.\d+/\d+$', '\1.1'),
             'subnet': item.cidr.split('/')[1],
             'enable': '1'
           }
         }) }}
  vars:
    _device: "{{ (pa_vlan_all.json.rows | selectattr('tag', 'equalto', item.tag | string) | first).vlanif }}"
  loop: "{{ pa_opnsense_segments }}"
  loop_control:
    label: "{{ item.name }} -> {{ pa_device_to_ident[_device] }}"

- name: Déposer le script d'adressage sur le pare-feu
  ansible.builtin.copy:
    src: set_interface_addr.py
    dest: /usr/local/bin/pa_set_interface_addr.py
    mode: "0700"
    owner: root
    group: wheel
  delegate_to: "{{ pa_opnsense_host }}"

- name: Appliquer l'adressage dans la configuration
  ansible.builtin.command:
    argv:
      - /usr/local/bin/python3
      - /usr/local/bin/pa_set_interface_addr.py
      - /conf/config.xml
      - "{{ pa_wanted_addressing | to_json }}"
  delegate_to: "{{ pa_opnsense_host }}"
  register: pa_addr_apply
  failed_when: pa_addr_apply.rc not in [0, 2]
  changed_when: pa_addr_apply.rc == 2
  notify: Recharger les interfaces